<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H5 Lens</title>
<style>
  @import url('fonts/fonts.css');   /* bundled DM Sans + JetBrains Mono: same look offline */

  :root {
    --bg-0: #0b0e14;
    --bg-1: #10141c;
    --bg-2: #151a24;
    --bg-3: #1a2030;
    --bg-hover: #1e2538;
    --bg-active: #232b3e;
    --border: #252d3d;
    --border-subtle: #1c2333;
    --tx-1: #e0e6f0;
    --tx-2: #8892a6;
    --tx-3: #576070;
    --accent: #5b9ef5;
    --accent-soft: rgba(91,158,245,0.12);
    --accent-hover: #7db5ff;
    --green: #47d185;
    --green-soft: rgba(71,209,133,0.12);
    --amber: #e5a646;
    --amber-soft: rgba(229,166,70,0.12);
    --red: #ef6b6b;
    --purple: #b48eff;
    --purple-soft: rgba(180,142,255,0.12);
    --cyan: #56d4e0;
    --cyan-soft: rgba(86,212,224,0.12);
    --mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
    --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius: 6px;
    --dur: 120ms;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%; overflow: hidden;
    background: var(--bg-0); color: var(--tx-1);
    font-family: var(--sans); font-size: 13px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--tx-3); }

  /* ═══════════════════ LAYOUT ═══════════════════ */

  #app { display: grid; grid-template-rows: 44px 1fr 24px; height: 100vh; }

  /* ── Header ── */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px; background: var(--bg-1);
    border-bottom: 1px solid var(--border);
    -webkit-app-region: drag;        /* allow window dragging */
    z-index: 100;
  }
  header > * { -webkit-app-region: no-drag; }

  .logo {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-weight: 600; font-size: 13px;
    letter-spacing: -0.3px; white-space: nowrap; color: var(--tx-1);
    -webkit-app-region: drag;
  }
  .logo-mark {
    width: 24px; height: 24px; border-radius: 5px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #fff;
    box-shadow: 0 2px 6px rgba(91,158,245,0.25);
  }

  .sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }

  /* breadcrumb */
  #breadcrumb {
    display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0;
    font-family: var(--mono); font-size: 11.5px; color: var(--tx-2);
    overflow: hidden; white-space: nowrap;
  }
  .crumb {
    padding: 2px 5px; border-radius: 3px; cursor: pointer;
    transition: all var(--dur); flex-shrink: 0;
  }
  .crumb:hover { background: var(--bg-hover); color: var(--accent); }
  .crumb.active { color: var(--tx-1); }
  .crumb-sep { color: var(--tx-3); flex-shrink: 0; font-size: 10px; }

  /* buttons */
  .hdr-actions { display: flex; gap: 4px; flex-shrink: 0; }

  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px; font-family: var(--sans); font-size: 12px; font-weight: 500;
    color: var(--tx-2); background: var(--bg-2); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer;
    transition: all var(--dur); white-space: nowrap;
  }
  .btn:hover { background: var(--bg-hover); color: var(--tx-1); border-color: var(--tx-3); }
  .btn svg { width: 14px; height: 14px; }
  .btn-primary { background: var(--accent-soft); border-color: rgba(91,158,245,0.3); color: var(--accent); }
  .btn-primary:hover { background: var(--accent); color: #fff; }
  .btn-icon { padding: 5px 7px; }
  .btn:disabled { opacity: 0.35; pointer-events: none; }

  /* ── Main ── */
  main {
    --sbw: 280px;
    display: grid; grid-template-columns: var(--sbw) 1fr;
    overflow: hidden; position: relative;
  }
  main.empty { grid-template-columns: 1fr; }
  main.empty .sidebar,
  main.empty .content,
  main.empty .resize-handle { display: none; }

  /* ── Sidebar ── */
  .sidebar {
    display: flex; flex-direction: column;
    background: var(--bg-1); border-right: 1px solid var(--border);
    overflow: hidden;
  }

  .sidebar-head {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 12px; border-bottom: 1px solid var(--border-subtle);
  }
  .sidebar-label {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--tx-3); flex: 1;
  }
  .badge {
    font-family: var(--mono); font-size: 10px;
    padding: 1px 7px; border-radius: 8px;
    background: var(--bg-3); color: var(--tx-3);
  }

  /* search */
  .search-wrap {
    position: relative; padding: 6px 8px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .search-wrap input {
    width: 100%; padding: 6px 8px 6px 28px;
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--tx-1);
    font-family: var(--mono); font-size: 11px; outline: none;
    transition: border var(--dur);
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--tx-3); }
  .search-wrap svg {
    position: absolute; left: 17px; top: 50%; transform: translateY(-50%);
    width: 13px; height: 13px; color: var(--tx-3); pointer-events: none;
  }

  /* tree */
  .tree { flex: 1; overflow-y: auto; padding: 4px 0; }

  .tnode {
    display: flex; align-items: center; gap: 3px;
    padding: 3px 10px 3px calc(10px + var(--d, 0) * 16px);
    cursor: pointer; transition: background var(--dur);
    font-family: var(--mono); font-size: 12px; min-height: 28px;
  }
  .tnode:hover { background: var(--bg-hover); }
  .tnode.sel { background: var(--accent-soft); color: var(--accent-hover); }

  .tnode .chev {
    width: 14px; height: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--tx-3); transition: transform var(--dur);
  }
  .tnode .chev.open { transform: rotate(90deg); }
  .tnode .chev.hide { visibility: hidden; }

  .tnode .ico { width: 15px; height: 15px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .tnode .ico.grp { color: var(--amber); }
  .tnode .ico.ds  { color: var(--cyan); }
  .tnode .ico.rt  { color: var(--accent); }
  .tnode .ico.lnk { color: var(--purple); }
  .tnode .ico.err { color: var(--red); }
  .tnode.err .lbl { color: var(--red); }
  .tnode.link .lbl { font-style: italic; color: var(--tx-2); }
  .tree:focus { outline: none; }
  .tree:focus .tnode.sel { box-shadow: inset 2px 0 0 var(--accent); }
  .tree-empty { padding: 16px; color: var(--tx-3); font-size: 12px; text-align: center; }

  .tnode .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tnode .meta {
    font-size: 10px; padding: 0 5px; border-radius: 3px;
    background: var(--bg-3); color: var(--tx-3); flex-shrink: 0;
  }

  /* ── Content ── */
  .content { display: flex; flex-direction: column; overflow: hidden; }

  /* placeholder */
  .hint {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 10px; color: var(--tx-3); font-size: 13px;
  }
  .hint svg { width: 36px; height: 36px; opacity: 0.2; }

  /* info bar */
  .info-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 16px; background: var(--bg-1);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .chip {
    font-family: var(--mono); font-size: 11px;
    padding: 2px 8px; border-radius: 4px; white-space: nowrap;
  }
  .chip.tp  { background: var(--purple-soft); color: var(--purple); }
  .chip.dt  { background: var(--amber-soft); color: var(--amber); }
  .chip.sh  { background: var(--green-soft); color: var(--green); }
  .chip.sz  { background: var(--accent-soft); color: var(--accent); }
  .chip.at  { background: var(--cyan-soft); color: var(--cyan); }
  .info-sep { flex: 1; }

  /* tabs */
  .tabs {
    display: flex; gap: 2px; padding: 0 10px;
    background: var(--bg-1); border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .tab {
    padding: 8px 14px; font-size: 12px; font-weight: 500;
    color: var(--tx-3); cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all var(--dur);
  }
  .tab:hover { color: var(--tx-2); }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); }

  /* tab panes */
  .pane { flex: 1; overflow: auto; display: none; flex-direction: column; }
  .pane.on { display: flex; }

  /* ── Data Table ── */
  .tbl-wrap { overflow: auto; flex: 1; }
  .dtbl td, .attr-v, .scalar-val, .stat-value, .err-box { user-select: text; cursor: text; }
  .dtbl td.nan { color: var(--tx-3); }
  .dtbl tbody tr.clk { cursor: pointer; }
  .dtbl tbody tr.clk td { cursor: pointer; user-select: none; }
  .tbl-notice {
    padding: 6px 14px; background: var(--amber-soft); color: var(--amber);
    font-family: var(--mono); font-size: 11px; text-align: center; flex-shrink: 0;
  }

  table.dtbl {
    width: 100%; border-collapse: collapse;
    font-family: var(--mono); font-size: 11.5px;
  }
  .dtbl thead { position: sticky; top: 0; z-index: 5; }
  .dtbl th {
    background: var(--bg-2); color: var(--tx-3);
    padding: 7px 12px; text-align: left; font-weight: 500;
    border-bottom: 1px solid var(--border); white-space: nowrap;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px;
  }
  .dtbl th.ri {
    width: 56px; text-align: right; padding-right: 10px;
    background: var(--bg-1); border-right: 1px solid var(--border);
  }
  .dtbl td {
    padding: 4px 12px; border-bottom: 1px solid var(--border-subtle);
    white-space: nowrap; max-width: 280px; overflow: hidden; text-overflow: ellipsis;
  }
  .dtbl td.ri {
    text-align: right; padding-right: 10px; color: var(--tx-3);
    background: var(--bg-1); border-right: 1px solid var(--border);
    font-size: 10px;
  }
  .dtbl tbody tr:hover td { background: var(--bg-hover); }
  .dtbl tbody tr:hover td.ri { background: var(--bg-2); }

  /* N-D plane picker */
  .plane-bar {
    display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap;
    padding: 6px 14px; background: var(--bg-1); flex-shrink: 0;
    border-bottom: 1px solid var(--border-subtle);
    font-family: var(--mono); font-size: 11px; color: var(--tx-3);
  }
  .plane-ax { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .plane-ax b { font-weight: 500; color: var(--tx-2); }
  .plane-ax select, .plane-ax input {
    background: var(--bg-2); color: var(--tx-1); border: 1px solid var(--border);
    border-radius: 4px; font-family: var(--mono); font-size: 11px; padding: 2px 4px; outline: none;
  }
  .plane-ax input { width: 70px; }
  .plane-ax select:focus, .plane-ax input:focus { border-color: var(--accent); }
  .plane-bar .fill { flex: 1; }
  .pane-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* scalar */
  .scalar-box {
    display: flex; align-items: center; justify-content: center; height: 100%;
  }
  .scalar-inner {
    text-align: center; padding: 36px 56px;
    background: var(--bg-1); border: 1px solid var(--border);
    border-radius: 10px;
  }
  .scalar-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--tx-3); margin-bottom: 10px; }
  .scalar-val { font-family: var(--mono); font-size: 28px; font-weight: 600; color: var(--accent); word-break: break-all; }

  /* attrs */
  .attrs-grid { padding: 14px 18px; }
  .attr-row {
    display: grid; grid-template-columns: 170px 1fr;
    gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border-subtle);
    font-size: 12px; align-items: baseline;
  }
  .attr-k { font-family: var(--mono); font-size: 11.5px; color: var(--tx-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attr-v { font-family: var(--mono); font-size: 11.5px; color: var(--tx-1); word-break: break-all; }

  /* stats */
  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px; padding: 18px;
  }
  .stat-card {
    background: var(--bg-1); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
  }
  .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--tx-3); margin-bottom: 6px; }
  .stat-value { font-family: var(--mono); font-size: 18px; font-weight: 600; color: var(--tx-1); word-break: break-all; }
  .stat-value.dim { color: var(--tx-3); font-size: 14px; font-weight: 500; }

  /* image preview */
  .img-box { flex: 1; min-height: 0; display: flex; padding: 16px; overflow: auto; }
  .img-box img {
    width: 100%; height: 100%; object-fit: contain;
    image-rendering: pixelated; cursor: zoom-in;
  }
  .img-box.actual img { width: auto; height: auto; flex-shrink: 0; cursor: zoom-out; }

  .img-note {
    padding: 6px 14px; font-family: var(--mono); font-size: 11px; color: var(--tx-3);
    border-bottom: 1px solid var(--border-subtle); flex-shrink: 0;
  }
  .err-box {
    margin: 24px; padding: 14px 16px; border: 1px solid rgba(239,107,107,0.35);
    background: rgba(239,107,107,0.08); color: var(--red); border-radius: var(--radius);
    font-family: var(--mono); font-size: 12px; word-break: break-word;
  }
  .chip.click { cursor: pointer; }
  .chip.click:hover { filter: brightness(1.25); }

  /* empty */
  .empty-msg {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: var(--tx-3); font-size: 13px;
  }

  /* ── Welcome ── */
  .welcome {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; gap: 28px; padding: 40px;
  }
  main:not(.empty) .welcome { display: none; }

  .drop-zone {
    width: 100%; max-width: 480px; padding: 52px 36px;
    border: 2px dashed var(--border); border-radius: 12px;
    display: flex; flex-direction: column; align-items: center;
    gap: 18px; cursor: pointer; transition: all 0.25s ease;
  }
  .drop-zone:hover, .drop-zone.drag {
    border-color: var(--accent); background: var(--accent-soft);
    box-shadow: 0 0 36px rgba(91,158,245,0.06);
  }
  .drop-big {
    width: 56px; height: 56px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent-soft), var(--purple-soft));
    display: flex; align-items: center; justify-content: center;
  }
  .drop-big svg { width: 24px; height: 24px; stroke: var(--accent); }
  .drop-title { font-size: 16px; font-weight: 500; }
  .drop-sub { font-size: 12px; color: var(--tx-2); text-align: center; line-height: 1.6; }
  .drop-fmts { display: flex; gap: 6px; }
  .drop-fmts span {
    font-family: var(--mono); font-size: 10px; padding: 2px 8px;
    border-radius: 3px; background: var(--bg-3); color: var(--tx-3); border: 1px solid var(--border);
  }

  /* recent files */
  .recent-list {
    width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 2px;
  }
  .recent-head { display: flex; align-items: baseline; margin-bottom: 6px; }
  .recent-title {
    flex: 1; font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--tx-3);
  }
  .recent-clear { font-size: 11px; color: var(--tx-3); cursor: pointer; }
  .recent-clear:hover { color: var(--accent); }
  .recent-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px; border-radius: var(--radius);
    cursor: pointer; transition: background var(--dur);
    font-family: var(--mono); font-size: 11.5px; color: var(--tx-2);
  }
  .recent-item:hover { background: var(--bg-hover); color: var(--tx-1); }
  .recent-item svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--tx-3); }
  .recent-item .nm { flex-shrink: 0; }
  .recent-item .dir { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tx-3); font-size: 10.5px; direction: rtl; text-align: left; }
  .recent-item.missing { opacity: 0.45; }
  .recent-item .x { opacity: 0; padding: 0 4px; color: var(--tx-3); font-size: 14px; line-height: 1; }
  .recent-item:hover .x { opacity: 1; }
  .recent-item .x:hover { color: var(--red); }
  .welcome-foot { font-family: var(--mono); font-size: 10.5px; color: var(--tx-3); }

  /* ── Resize Handle ── */
  .resize-handle {
    position: absolute; left: calc(var(--sbw) - 2px); top: 0; width: 4px; height: 100%;
    cursor: col-resize; z-index: 50; background: transparent;
    transition: background var(--dur);
  }
  .resize-handle:hover, .resize-handle.dragging { background: var(--accent); }

  /* ── Status Bar ── */
  .status {
    display: flex; align-items: center; gap: 14px;
    padding: 0 14px; background: var(--bg-1);
    border-top: 1px solid var(--border);
    font-family: var(--mono); font-size: 10.5px; color: var(--tx-3);
  }
  .status .fill { flex: 1; }

  /* ── Loading ── */
  .loading-mask {
    position: fixed; inset: 0; background: rgba(11,14,20,0.75);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; backdrop-filter: blur(3px);
  }
  .spinner { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .spin-ring {
    width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin-text { font-size: 12px; color: var(--tx-2); }

  /* ── Toast ── */
  .toast-msg {
    position: fixed; bottom: 36px; right: 16px;
    padding: 8px 16px; background: var(--bg-3); border: 1px solid var(--border);
    border-radius: var(--radius); font-size: 12px; color: var(--tx-1);
    box-shadow: 0 6px 20px rgba(0,0,0,0.4); z-index: 2000;
    opacity: 0; transform: translateY(8px);
    transition: all 0.25s ease; pointer-events: none;
  }
  .toast-msg.show { opacity: 1; transform: translateY(0); }
  .toast-msg.err { border-color: rgba(239,107,107,0.5); color: var(--red); }

  /* ── Animations ── */
  @keyframes fadeUp { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
  .fade-up { animation: fadeUp 0.2s ease forwards; }
</style>
</head>
<body>

<div id="app">
  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-mark">H5</div>
      <span>H5 Lens</span>
    </div>
    <div class="sep"></div>
    <div id="breadcrumb"></div>
    <div class="hdr-actions">
      <button class="btn btn-primary" id="btnOpen" title="Open file (Ctrl+O)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4l2 2h4a2 2 0 0 1 2 2v1"/><path d="M21 15l-3.5-7H7.5L4 15h17z"/></svg>
        Open
      </button>
      <button class="btn" id="btnExport" disabled title="Export dataset as CSV (Ctrl+E)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export
      </button>
      <button class="btn" id="btnStats" disabled title="Compute statistics (Ctrl+I)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
        Stats
      </button>
      <button class="btn btn-icon" id="btnClose" disabled title="Close file (Ctrl+W)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </header>

  <!-- Main -->
  <main id="main" class="empty">
    <div class="resize-handle" id="resizeHandle"></div>

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-label">Explorer</span>
        <span class="badge" id="nodeCount"></span>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Filter…" spellcheck="false" />
      </div>
      <div class="tree" id="tree" tabindex="0"></div>
    </aside>

    <!-- Content -->
    <section class="content" id="content">
      <div class="hint" id="hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
        Select a node from the tree
      </div>
    </section>

    <!-- Welcome -->
    <div class="welcome" id="welcome">
      <div class="drop-zone" id="dropZone">
        <div class="drop-big">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <div class="drop-title">Open an HDF5 file</div>
        <div class="drop-sub">Click to browse, or drop a file here</div>
        <div class="drop-fmts"><span>.h5</span><span>.hdf5</span><span>.hdf</span><span>.he5</span><span>.nc</span></div>
      </div>
      <div class="recent-list" id="recentList"></div>
      <div class="welcome-foot" id="welcomeFoot"></div>
    </div>
  </main>

  <!-- Status -->
  <div class="status">
    <span id="stLeft">No file loaded</span>
    <span class="fill"></span>
    <span id="stRight">Ctrl+O Open · / Search · ↑↓←→ Navigate · Ctrl+E Export</span>
  </div>
</div>

<div class="toast-msg" id="toast"></div>

<script>
'use strict';
// ═══════════════════ Bridge ═══════════════════
// pywebview injects window.pywebview.api asynchronously; everything that talks
// to Python awaits this promise, so calls made early (e.g. openFile() from the
// command line) wait instead of being dropped.
const apiReady = new Promise(resolve => {
  let done = false;
  const check = () => {
    const a = window.pywebview && window.pywebview.api;
    if (!done && a && typeof a.open_file === 'function') { done = true; resolve(a); }
    return done;
  };
  if (check()) return;
  window.addEventListener('pywebviewready', check);
  const iv = setInterval(() => { if (check()) clearInterval(iv); }, 100);
});

// ═══════════════════ State ═══════════════════
const S = {
  tree: null,              // root node from the backend
  byPath: new Map(),       // path -> node
  parent: new Map(),       // path -> parent path
  expanded: new Set(['/']),
  sel: null,               // selected node
  view: null,              // { path, tabs } of the content currently shown
  filter: '',
  match: new Map(),        // filter match memo
  busy: false,
  token: 0,                // bumps on every selection; stale renders are dropped
  lastOpenAt: 0,
  cfg: { precision: 8, maxImagePx: 4000000 },
};

// ═══════════════════ Refs ═══════════════════
const $ = id => document.getElementById(id);
const mainEl = $('main');
const treeEl = $('tree');
const contentEl = $('content');
const hintEl = $('hint');
const searchEl = $('searchInput');

// ═══════════════════ Utilities ═══════════════════
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function esc(s) { return String(s).replace(/[&<>"']/g, c => ESC[c]); }
function formatLabel(k) { return k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function fmtShape(shape) { return !shape || shape.length === 0 ? 'scalar' : shape.join(' × '); }
function fmtInt(n) { return typeof n === 'number' ? n.toLocaleString() : String(n); }
function fmtBytes(b) {
  if (!b) return '0 B';
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return i ? b.toFixed(1) + ' ' + u[i] : b + ' B';
}
function fmtFloat(v) { return String(parseFloat(v.toPrecision(S.cfg.precision))); }
// Floats arrive at full precision; float_precision sets significant digits.
function fmtVal(v) {
  if (typeof v === 'number') return Number.isInteger(v) ? String(v) : fmtFloat(v);
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (v === null || v === undefined) return '—';
  if (Array.isArray(v)) return '[' + v.slice(0, 50).map(fmtVal).join(', ') + (v.length > 50 ? ', …' : '') + ']';
  return String(v);
}
const NONFINITE = new Set(['NaN', 'Inf', '-Inf']);

let toastT = null;
function toast(msg, isErr = false) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.toggle('err', isErr);
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), isErr ? 4500 : 2400);
}

// The mask appears only if work takes longer than a moment, to avoid flicker.
let loadT = null;
function showLoad(msg = 'Loading…') {
  clearTimeout(loadT);
  loadT = setTimeout(() => {
    let el = document.querySelector('.loading-mask');
    if (!el) {
      el = document.createElement('div');
      el.className = 'loading-mask';
      el.innerHTML = '<div class="spinner"><div class="spin-ring"></div><div class="spin-text"></div></div>';
      document.body.appendChild(el);
    }
    el.querySelector('.spin-text').textContent = msg;
    el.style.display = '';
  }, 150);
}
function hideLoad() {
  clearTimeout(loadT);
  const el = document.querySelector('.loading-mask');
  if (el) el.style.display = 'none';
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (_) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  toast('Copied ' + text);
}

// ═══════════════════ Open / Close ═══════════════════
async function openFile(filepath) {
  if (S.busy) return;
  S.busy = true;
  S.lastOpenAt = Date.now();
  try {
    const a = await apiReady;
    showLoad('Opening file…');
    const res = filepath ? await a.open_file(filepath) : await a.open_file_dialog();
    if (!res.ok) {
      if (res.error !== 'cancelled') toast('Error: ' + res.error, true);
      if (filepath) loadRecent();
      return;
    }
    loadTree(res.tree);
    mainEl.classList.remove('empty');
    $('btnClose').disabled = false;
    $('stLeft').textContent = res.filename + ' · ' + res.size_fmt + ' · ' + fmtInt(S.byPath.size) + ' nodes';
    $('stLeft').title = res.filepath;
    selectNode(S.tree);
    toast('Opened ' + res.filename);
  } catch (e) {
    toast('Error: ' + e, true);
  } finally {
    hideLoad();
    S.busy = false;
  }
}

async function closeFile() {
  const a = await apiReady;
  try { await a.close_file(); } catch (_) {}
  S.token++;                               // drop renders still in flight
  S.tree = null; S.sel = null; S.view = null;
  S.byPath.clear(); S.parent.clear();
  treeEl.innerHTML = '';
  clearContent();
  mainEl.classList.add('empty');
  $('breadcrumb').innerHTML = '';
  $('stLeft').textContent = 'No file loaded';
  $('stLeft').title = '';
  ['btnClose', 'btnExport', 'btnStats'].forEach(id => $(id).disabled = true);
  setFilter('');
  loadRecent();
}

// ═══════════════════ Tree ═══════════════════
function loadTree(root) {
  S.tree = root;
  S.byPath.clear(); S.parent.clear();
  const index = (n, parentPath) => {
    S.byPath.set(n.path, n);
    if (parentPath !== null) S.parent.set(n.path, parentPath);
    for (const c of n.children || []) index(c, n.path);
  };
  index(root, null);
  S.expanded = new Set(['/']);
  S.sel = null;
  $('nodeCount').textContent = fmtInt(S.byPath.size);
  setFilter('');
}

function matches(node, f) {
  let m = S.match.get(node.path);
  if (m === undefined) {
    const hay = f.includes('/') ? node.path.toLowerCase() : node.name.toLowerCase();
    m = hay.includes(f) || (node.children || []).some(c => matches(c, f));
    S.match.set(node.path, m);
  }
  return m;
}

const ICONS = {
  root: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>',
  group: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>',
  dataset: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
  link: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
  error: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
  chev: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>',
};

function hasKids(n) { return n.type === 'group' && n.children && n.children.length > 0; }
function isOpen(n) { return hasKids(n) && (S.filter ? true : S.expanded.has(n.path)); }

// Only visible rows are built, so huge files stay responsive; the list is
// flat, which also makes keyboard navigation a matter of row order.
function renderTree() {
  treeEl.innerHTML = '';
  if (!S.tree) return;
  const f = S.filter.toLowerCase();
  const frag = document.createDocumentFragment();
  let shown = 0;
  const walk = (node, depth) => {
    if (f && !matches(node, f)) return;
    frag.appendChild(makeRow(node, depth));
    shown++;
    if (isOpen(node)) for (const c of node.children) walk(c, depth + 1);
  };
  walk(S.tree, 0);
  if (shown === 0) treeEl.innerHTML = '<div class="tree-empty">No matches</div>';
  else treeEl.appendChild(frag);
}

function makeRow(node, depth) {
  const el = document.createElement('div');
  const kids = hasKids(node);
  el.className = 'tnode' + (S.sel && S.sel.path === node.path ? ' sel' : '')
    + (node.type === 'error' ? ' err' : '') + (node.type === 'link' ? ' link' : '');
  el.style.setProperty('--d', depth);
  el.dataset.path = node.path;

  let ico, icoCls;
  if (node.path === '/') { ico = ICONS.root; icoCls = 'rt'; }
  else if (node.type === 'group') { ico = ICONS.group; icoCls = 'grp'; }
  else if (node.type === 'dataset') { ico = ICONS.dataset; icoCls = 'ds'; }
  else if (node.type === 'link') { ico = ICONS.link; icoCls = 'lnk'; }
  else { ico = ICONS.error; icoCls = 'err'; }

  let meta = '';
  if (node.type === 'dataset') meta = node.null ? 'null' : fmtShape(node.shape);
  else if (kids) meta = String(node.children.length);

  const title = node.type === 'link' ? `${node.path} → ${node.target}`
    : node.type === 'error' ? `${node.path}\n${node.error}` : node.path;
  el.innerHTML =
    `<span class="chev${kids ? '' : ' hide'}${isOpen(node) ? ' open' : ''}">${ICONS.chev}</span>` +
    `<span class="ico ${icoCls}">${ico}</span>` +
    `<span class="lbl" title="${esc(title)}">${esc(node.path === '/' ? 'Root' : node.name)}</span>` +
    (meta ? `<span class="meta">${esc(meta)}</span>` : '');
  return el;
}

function setExpanded(path, open) {
  if (S.filter) return;              // filtering shows every match expanded
  if (open) S.expanded.add(path); else S.expanded.delete(path);
  renderTree();
}

function reveal(path) {
  let p = S.parent.get(path);
  while (p !== undefined) { S.expanded.add(p); p = S.parent.get(p); }
}

function rowFor(path) { return treeEl.querySelector(`.tnode[data-path="${CSS.escape(path)}"]`); }

function markSelected() {
  treeEl.querySelectorAll('.tnode.sel').forEach(e => e.classList.remove('sel'));
  if (!S.sel) return;
  const row = rowFor(S.sel.path);
  if (row) { row.classList.add('sel'); row.scrollIntoView({ block: 'nearest' }); }
}

treeEl.addEventListener('click', e => {
  const row = e.target.closest('.tnode');
  if (!row) return;
  const node = S.byPath.get(row.dataset.path);
  if (!node) return;
  const onChev = !!e.target.closest('.chev');
  const wasSel = S.sel && S.sel.path === node.path;
  if (hasKids(node) && (onChev || wasSel)) setExpanded(node.path, !isOpen(node));
  else if (hasKids(node) && !isOpen(node)) setExpanded(node.path, true);
  if (!onChev) selectNode(node, { follow: true });
});

function setFilter(text) {
  S.filter = text;
  S.match.clear();
  if (searchEl.value !== text) searchEl.value = text;
  if (!text && S.sel) reveal(S.sel.path);   // keep the selection visible
  renderTree();
  markSelected();
}

let filterT = null;
searchEl.addEventListener('input', () => {
  clearTimeout(filterT);
  filterT = setTimeout(() => setFilter(searchEl.value.trim()), 120);
});

// ═══════════════════ Selection ═══════════════════
let renderT = null;
function selectNode(node, opts = {}) {
  if (!node) return;
  if (node.type === 'link' && opts.follow) {
    const target = S.byPath.get(node.target);
    if (target) return selectNode(target, { reveal: true });
  }
  const changed = !S.sel || S.sel.path !== node.path;
  S.sel = node;
  if (opts.reveal) { reveal(node.path); renderTree(); }
  markSelected();
  updateBreadcrumb(node.path);
  $('btnExport').disabled = node.type !== 'dataset';
  $('btnStats').disabled = node.type !== 'dataset';
  if (!changed && S.view && S.view.path === node.path) return;

  const token = ++S.token;
  clearTimeout(renderT);
  // Keyboard navigation defers loading so holding an arrow key stays smooth.
  renderT = setTimeout(() => renderNode(node, token), opts.defer ? 140 : 0);
}

async function renderNode(node, token) {
  try {
    if (node.type === 'group') await renderGroup(node, token);
    else if (node.type === 'dataset') await renderDataset(node, token);
    else renderProblem(node, token);
  } catch (e) {
    if (token === S.token) toast('Error: ' + e, true);
  }
}

function updateBreadcrumb(path) {
  const bc = $('breadcrumb');
  bc.innerHTML = '';
  const parts = path === '/' ? ['/'] : ['/', ...path.split('/').filter(Boolean)];
  parts.forEach((p, i) => {
    if (i > 0) {
      const s = document.createElement('span');
      s.className = 'crumb-sep';
      s.textContent = '›';
      bc.appendChild(s);
    }
    const c = document.createElement('span');
    c.className = 'crumb' + (i === parts.length - 1 ? ' active' : '');
    c.textContent = i === 0 ? 'Root' : p;
    const tp = i === 0 ? '/' : '/' + parts.slice(1, i + 1).join('/');
    c.addEventListener('click', () => selectNode(S.byPath.get(tp), { reveal: true }));
    bc.appendChild(c);
  });
  bc.title = path;
}

// ═══════════════════ Content ═══════════════════
function clearContent() {
  Array.from(contentEl.children).forEach(c => { if (c.id !== 'hint') c.remove(); });
  hintEl.style.display = '';
}

function newView() {
  const wrap = document.createElement('div');
  wrap.className = 'fade-up';
  wrap.style.cssText = 'height:100%;display:flex;flex-direction:column;min-height:0;';
  return wrap;
}

function mountView(node, wrap, tabs, token) {
  if (token !== S.token) return false;  // the user has moved on
  hintEl.style.display = 'none';
  clearContent();
  hintEl.style.display = 'none';
  contentEl.appendChild(wrap);
  S.view = { path: node.path, tabs };
  return true;
}

function infoBar(chips, path) {
  const info = document.createElement('div');
  info.className = 'info-bar';
  info.innerHTML = chips.filter(Boolean).join('') +
    '<span class="info-sep"></span><span class="chip click at" title="Copy path to clipboard">Copy path</span>';
  info.lastElementChild.addEventListener('click', () => copyText(path));
  return info;
}

// Tab strip whose panes live in `wrap`; panes with onShow load lazily.
function makeTabs(wrap) {
  const bar = document.createElement('div');
  bar.className = 'tabs';
  wrap.appendChild(bar);
  const list = [];
  const tabs = {
    add(label, pane, onShow) {
      const el = document.createElement('div');
      el.className = 'tab';
      el.textContent = label;
      el.addEventListener('click', () => tabs.show(label));
      bar.appendChild(el);
      pane.classList.add('pane');
      wrap.appendChild(pane);
      list.push({ label, el, pane, onShow, loaded: false });
      if (list.length === 1) tabs.show(label);
      return pane;
    },
    get(label) { const t = list.find(t => t.label === label); return t ? t.pane : null; },
    // Load a lazy pane again: now if it is showing, else when next shown.
    reload(label) {
      const t = list.find(t => t.label === label);
      if (!t) return;
      t.loaded = false;
      if (t.el.classList.contains('on')) tabs.show(label);
    },
    show(label) {
      for (const t of list) {
        const on = t.label === label;
        t.el.classList.toggle('on', on);
        t.pane.classList.toggle('on', on);
        if (on && t.onShow && !t.loaded) { t.loaded = true; t.onShow(t.pane); }
      }
    },
  };
  return tabs;
}

function div(cls, html) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  if (html !== undefined) d.innerHTML = html;
  return d;
}

function errBox(msg) { return `<div class="err-box">${esc(msg)}</div>`; }

function renderAttrs(res) {
  if (!res || !res.ok) return div('', errBox((res && res.error) || 'Could not read attributes'));
  const keys = Object.keys(res.attrs || {});
  if (keys.length === 0) return div('attrs-grid', '<div class="empty-msg" style="height:auto;padding:32px">No attributes</div>');
  let h = '';
  for (const k of keys) {
    h += `<div class="attr-row"><span class="attr-k" title="${esc(k)}">${esc(k)}</span><span class="attr-v">${esc(fmtVal(res.attrs[k]))}</span></div>`;
  }
  return div('attrs-grid', h);
}

function cellHtml(v) {
  const t = fmtVal(v);
  const cls = typeof v === 'string' && NONFINITE.has(v) ? ' class="nan"' : '';
  const title = t.length > 32 ? ` title="${esc(t.length > 2000 ? t.slice(0, 2000) + '…' : t)}"` : '';
  return `<td${cls}${title}>${esc(t)}</td>`;
}

// One innerHTML assignment is far faster than building rows node by node.
function tableHtml(headers, rows) {
  const out = ['<table class="dtbl"><thead><tr>'];
  headers.forEach((h, i) => out.push(i === 0 ? `<th class="ri">${esc(h)}</th>` : `<th>${esc(h)}</th>`));
  out.push('</tr></thead><tbody>');
  for (const r of rows) {
    out.push(`<tr><td class="ri">${esc(r[0])}</td>`);
    for (let i = 1; i < r.length; i++) out.push(cellHtml(r[i]));
    out.push('</tr>');
  }
  out.push('</tbody></table>');
  return out.join('');
}

// ── Group ──
async function renderGroup(node, token) {
  const a = await apiReady;
  const attrRes = await a.get_attrs(node.path);
  const wrap = newView();
  wrap.appendChild(infoBar([
    '<span class="chip tp">Group</span>',
    `<span class="chip sh">${fmtInt(node.children.length)} children</span>`,
    `<span class="chip at">${node.attr_count || 0} attrs</span>`,
  ], node.path));
  const tabs = makeTabs(wrap);

  const pChildren = document.createElement('div');
  if (node.error) {
    pChildren.innerHTML = errBox('Could not list members: ' + node.error);
  } else if (node.children.length === 0) {
    pChildren.innerHTML = '<div class="empty-msg">Empty group</div>';
  } else {
    const rows = node.children.map(c => {
      let type, shape = '—', dtype = '—', size = '—';
      if (c.type === 'group') type = '<span style="color:var(--amber)">Group</span>';
      else if (c.type === 'dataset') {
        type = '<span style="color:var(--cyan)">Dataset</span>';
        shape = esc(c.null ? 'null' : fmtShape(c.shape));
        dtype = esc(c.dtype);
        size = esc(fmtBytes(c.nbytes));
      } else if (c.type === 'link') type = `<span style="color:var(--purple)">Link → ${esc(c.target)}</span>`;
      else type = `<span style="color:var(--red)" title="${esc(c.error || c.kind || '')}">${c.type === 'error' ? 'Unreadable' : esc(c.kind || 'Other')}</span>`;
      return `<tr class="clk" data-path="${esc(c.path)}"><td style="color:var(--accent)">${esc(c.name)}</td><td>${type}</td><td>${shape}</td><td>${dtype}</td><td>${size}</td><td>${esc(c.compression || '—')}</td></tr>`;
    });
    const tw = div('tbl-wrap', '<table class="dtbl"><thead><tr><th>Name</th><th>Type</th><th>Shape</th><th>Dtype</th><th>Size</th><th>Compression</th></tr></thead><tbody>' + rows.join('') + '</tbody></table>');
    tw.addEventListener('click', e => {
      const tr = e.target.closest('tr.clk');
      if (tr) selectNode(S.byPath.get(tr.dataset.path), { reveal: true, follow: true });
    });
    pChildren.appendChild(tw);
  }
  tabs.add('Children', pChildren);
  tabs.add('Attributes', renderAttrs(attrRes));
  mountView(node, wrap, tabs, token);
}

// ── Dataset ──
async function renderDataset(node, token) {
  const a = await apiReady;
  const p = node.path;
  const [dataRes, attrRes, detRes] = await Promise.all([a.get_data(p), a.get_attrs(p), a.get_details(p)]);
  if (token !== S.token) return;

  const wrap = newView();
  wrap.appendChild(infoBar([
    '<span class="chip tp">Dataset</span>',
    `<span class="chip dt">${esc(node.dtype)}</span>`,
    `<span class="chip sh">${esc(node.null ? 'null' : fmtShape(node.shape))}</span>`,
    `<span class="chip sz">${fmtInt(node.size)} values · ${esc(fmtBytes(node.nbytes))}</span>`,
    `<span class="chip at">${node.attr_count || 0} attrs</span>`,
    node.compression ? `<span class="chip" style="background:var(--green-soft);color:var(--green)">${esc(node.compression)}${node.compression_opts ? ' ' + esc(node.compression_opts) : ''}</span>` : '',
  ], p));
  const tabs = makeTabs(wrap);

  // Data (a dataset with 3+ axes shows one 2-D plane, picked in a bar above)
  const sh = node.shape || [];
  const nd = !node.null && sh.length >= 3;
  const pData = document.createElement('div');
  const dataHost = nd ? div('pane-body') : pData;
  let plane = nd ? dataRes.plane : null;
  if (nd && plane) {
    let seq = 0;
    pData.appendChild(planeBar(sh, plane, async next => {
      plane = next;
      const my = ++seq;
      const res = await a.get_data(p, plane);
      if (my !== seq || token !== S.token) return;   // a newer plane, or another node
      fillData(dataHost, res);
      if (!wholeImg) tabs.reload('Image');        // an RGB image is the whole array
    }));
  }
  if (nd) pData.appendChild(dataHost);
  fillData(dataHost, dataRes);
  tabs.add('Data', pData);
  tabs.add('Attributes', renderAttrs(attrRes));

  // Details
  const pDetails = document.createElement('div');
  if (detRes.ok) {
    let h = '';
    for (const [k, v] of Object.entries(detRes.details)) {
      h += `<div class="attr-row"><span class="attr-k">${esc(formatLabel(k))}</span><span class="attr-v">${esc(fmtVal(v))}</span></div>`;
    }
    pDetails.appendChild(div('attrs-grid', h));
  } else {
    pDetails.innerHTML = errBox(detRes.error || 'Error');
  }
  tabs.add('Details', pDetails);

  // Image (lazy). 2-D and H×W×1/3/4 arrays render whole; any other N-D
  // dataset renders the plane chosen in the Data tab.
  const wholeImg = !node.null && (sh.length === 2 || (sh.length === 3 && [1, 3, 4].includes(sh[2])));
  const pixels = wholeImg ? sh[0] * sh[1] : 0;
  if (wholeImg && pixels > 0 && pixels <= S.cfg.maxImagePx) {
    tabs.add('Image', document.createElement('div'), pane => loadImage(p, pane, null));
  } else if (nd && plane && node.size > 0) {
    tabs.add('Image', document.createElement('div'), pane => loadImage(p, pane, plane));
  }

  mountView(node, wrap, tabs, token);
}

function fillData(host, res) {
  host.innerHTML = '';
  if (!res.ok) { host.innerHTML = errBox(res.error); return; }
  if (res.mode === 'scalar') {
    host.innerHTML = `<div class="scalar-box"><div class="scalar-inner"><div class="scalar-lbl">Scalar Value</div><div class="scalar-val">${esc(fmtVal(res.value))}</div></div></div>`;
    return;
  }
  if (res.rows.length === 0) { host.innerHTML = '<div class="empty-msg">Empty dataset (no elements)</div>'; return; }
  if (res.truncated) {
    const msg = res.mode === '2d'
      ? `Preview: ${fmtInt(res.shown_rows)} of ${fmtInt(res.total_rows)} rows × ${fmtInt(res.shown_cols)} of ${fmtInt(res.total_cols)} columns`
      : `Preview: first ${fmtInt(res.shown_rows)} of ${fmtInt(res.total_rows)} rows`;
    host.appendChild(div('tbl-notice', esc(msg + ' · Export CSV for everything')));
  }
  host.appendChild(div('tbl-wrap', tableHtml(res.headers, res.rows)));
}

function planeText(plane) {
  const fixed = plane.map((v, ax) => typeof v === 'number' ? `axis ${ax} = ${v}` : null).filter(Boolean);
  return `rows: axis ${plane.indexOf('row')} · columns: axis ${plane.indexOf('col')} · ` + fixed.join(', ');
}

// One control per axis: rows, columns, or an index. Exactly one axis is rows
// and one is columns; choosing a role takes it from the axis that had it.
function planeBar(shape, plane, onChange) {
  plane = plane.slice();
  const bar = div('plane-bar');
  const emit = () => onChange(plane.slice());
  const draw = () => {
    bar.innerHTML = '<span>Plane</span>' + shape.map((n, ax) => {
      const v = plane[ax];
      const role = typeof v === 'number' ? 'idx' : v;
      const opt = (val, label) => `<option value="${val}"${role === val ? ' selected' : ''}>${label}</option>`;
      return `<span class="plane-ax" data-ax="${ax}"><b>axis ${ax}</b>` +
        `<select title="Axis ${ax} has length ${fmtInt(n)}">${opt('row', 'rows')}${opt('col', 'columns')}${opt('idx', 'index')}</select>` +
        (role === 'idx' ? `<input type="number" min="0" max="${Math.max(n - 1, 0)}" value="${v}" title="Index along axis ${ax}: 0 to ${fmtInt(Math.max(n - 1, 0))}">` : '') +
        `<span>of ${fmtInt(n)}</span></span>`;
    }).join('') + '<span class="fill"></span><span>Statistics and Export use the whole dataset</span>';
  };
  bar.addEventListener('change', e => {
    const sel = e.target.closest('select');
    if (!sel) return;
    const ax = Number(sel.closest('.plane-ax').dataset.ax);
    const old = plane[ax];
    if (sel.value === 'idx') {
      // the role this axis gives up goes to the first index axis
      const j = plane.findIndex((v, k) => k !== ax && typeof v === 'number');
      plane[j] = old;
      plane[ax] = 0;
    } else {
      const j = plane.indexOf(sel.value);
      plane[j] = typeof old === 'number' ? Math.min(old, Math.max(shape[j] - 1, 0)) : old;
      plane[ax] = sel.value;
    }
    draw();
    emit();
  });
  let inputT = null;
  bar.addEventListener('input', e => {
    const inp = e.target.closest('input');
    if (!inp) return;
    const ax = Number(inp.closest('.plane-ax').dataset.ax);
    const v = parseInt(inp.value, 10);
    if (Number.isNaN(v)) return;
    const c = clamp(v, 0, Math.max(shape[ax] - 1, 0));
    if (c !== v) inp.value = c;
    if (c === plane[ax]) return;
    plane[ax] = c;
    clearTimeout(inputT);
    inputT = setTimeout(emit, 150);    // holding an arrow key stays smooth
  });
  draw();
  return bar;
}

async function loadImage(path, pane, plane) {
  const my = pane.dataset.seq = String(Number(pane.dataset.seq || 0) + 1);
  pane.innerHTML = '<div class="empty-msg">Rendering image…</div>';
  const res = await (await apiReady).get_image(path, plane);
  if (pane.dataset.seq !== my) return;           // a newer plane was asked for
  if (!res.ok) { pane.innerHTML = errBox(res.error); return; }
  const note = (plane ? planeText(plane) + ' · ' : '') + `${res.width} × ${res.height} px · ` +
    (res.normalized ? 'values scaled linearly from min → max (NaN/Inf shown black)' : 'raw 8-bit values') +
    ' · click to toggle fit / actual size';
  pane.innerHTML = `<div class="img-note">${esc(note)}</div><div class="img-box"><img alt="" src="${res.data_uri}" /></div>`;
  const box = pane.querySelector('.img-box');
  box.querySelector('img').addEventListener('click', () => box.classList.toggle('actual'));
}

// ── Error / unsupported nodes ──
function renderProblem(node, token) {
  const wrap = newView();
  if (node.type === 'link') {
    wrap.appendChild(infoBar(['<span class="chip tp">Hard link</span>'], node.path));
    const box = div('hint', `<div>Same group as <span class="crumb" style="color:var(--accent)">${esc(node.target)}</span></div><div style="font-size:11px">Enter or click to go there</div>`);
    box.querySelector('.crumb').addEventListener('click', () => selectNode(node, { follow: true }));
    wrap.appendChild(box);
    mountView(node, wrap, null, token);
    return;
  }
  const label = node.type === 'error' ? 'Unreadable' : (node.kind || 'Unsupported object');
  wrap.appendChild(infoBar([`<span class="chip tp">${esc(label)}</span>`], node.path));
  const msg = node.type === 'error'
    ? 'This object could not be opened: ' + node.error
    : `H5 Lens cannot display this kind of object (${node.kind || node.type}).`;
  wrap.appendChild(div('', errBox(msg)));
  mountView(node, wrap, null, token);
}

// ═══════════════════ Stats / Export ═══════════════════
async function showStats() {
  const node = S.sel;
  if (!node || node.type !== 'dataset' || S.busy) return;
  S.busy = true;
  showLoad('Computing statistics…');
  let res;
  try {
    res = await (await apiReady).get_stats(node.path);
  } catch (e) {
    res = { ok: false, error: String(e) };
  } finally {
    hideLoad();
    S.busy = false;
  }
  if (!res.ok) { toast(res.error, true); return; }
  if (!S.view || S.view.path !== node.path || !S.view.tabs) return;   // moved on meanwhile

  const s = res.stats;
  const num = v => typeof v === 'number' ? (Number.isInteger(v) ? fmtInt(v) : fmtFloat(v)) : String(v);
  const card = (label, value, title) => value === null
    ? `<div class="stat-card" title="${esc(title || '')}"><div class="stat-label">${label}</div><div class="stat-value dim">skipped</div></div>`
    : `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-value">${esc(value)}</div></div>`;
  const html = '<div class="stats-grid">' + [
    card('Minimum', num(s.min)),
    card('Maximum', num(s.max)),
    card('Mean', num(s.mean)),
    card('Std Dev', num(s.std)),
    card('Median', s.median === null ? null : num(s.median), 'Too many values to hold in memory'),
    card('Total Elements', fmtInt(s.total)),
    card('Finite Values', fmtInt(s.finite)),
    card('NaN Count', fmtInt(s.nan_count)),
    card('±Inf Count', fmtInt(s.inf_count)),
    card('Unique Values', s.unique >= 0 ? fmtInt(s.unique) : null, 'Counted only below 1,000,000 finite values'),
  ].join('') + '</div>';

  const tabs = S.view.tabs;
  const pane = tabs.get('Statistics') || tabs.add('Statistics', document.createElement('div'));
  pane.innerHTML = html;
  tabs.show('Statistics');
}

async function exportCsv() {
  const node = S.sel;
  if (!node || node.type !== 'dataset' || S.busy) return;
  S.busy = true;
  try {
    const a = await apiReady;
    showLoad('Exporting…');
    const res = await a.export_csv_dialog(node.path);
    if (res.ok) toast('Exported to ' + res.path.split(/[/\\]/).pop());
    else if (res.error !== 'cancelled') toast('Export failed: ' + res.error, true);
  } catch (e) {
    toast('Export failed: ' + e, true);
  } finally {
    hideLoad();
    S.busy = false;
  }
}

// ═══════════════════ Recent files ═══════════════════
async function loadRecent() {
  const a = await apiReady;
  let recent = [];
  try { recent = (await a.get_recent_files()) || []; } catch (_) {}
  recent = recent.map(r => typeof r === 'string' ? { path: r, exists: true } : r);
  const list = $('recentList');
  list.innerHTML = '';
  if (recent.length === 0) return;

  const head = div('recent-head', '<span class="recent-title">Recent Files</span><span class="recent-clear">Clear</span>');
  head.querySelector('.recent-clear').addEventListener('click', async () => { await a.clear_recent(); loadRecent(); });
  list.appendChild(head);

  for (const r of recent) {
    const parts = r.path.split(/[/\\]/);
    const name = parts.pop();
    const item = div('recent-item' + (r.exists ? '' : ' missing'),
      `${ICONS.root}<span class="nm">${esc(name)}</span><span class="dir"><bdi>${esc(parts.join('/'))}</bdi></span><span class="x" title="Remove from list">×</span>`);
    item.title = r.exists ? r.path : r.path + ' (not found)';
    item.addEventListener('click', e => {
      if (e.target.closest('.x')) { a.remove_recent(r.path).then(loadRecent); return; }
      openFile(r.path);
    });
    list.appendChild(item);
  }
}

// ═══════════════════ Events ═══════════════════
$('btnOpen').addEventListener('click', () => openFile(null));
$('dropZone').addEventListener('click', () => openFile(null));
$('btnExport').addEventListener('click', exportCsv);
$('btnStats').addEventListener('click', showStats);
$('btnClose').addEventListener('click', closeFile);

function visibleRows() { return Array.from(treeEl.querySelectorAll('.tnode')); }

function treeKey(e) {
  const rows = visibleRows();
  if (rows.length === 0) return;
  const idx = S.sel ? rows.findIndex(r => r.dataset.path === S.sel.path) : -1;
  const node = S.sel;
  const go = i => selectNode(S.byPath.get(rows[clamp(i, 0, rows.length - 1)].dataset.path), { defer: true });
  switch (e.key) {
    case 'ArrowDown': go(idx + 1); break;
    case 'ArrowUp': go(idx < 0 ? 0 : idx - 1); break;
    case 'Home': go(0); break;
    case 'End': go(rows.length - 1); break;
    case 'PageDown': go(idx + 15); break;
    case 'PageUp': go(idx - 15); break;
    case 'ArrowRight':
      if (node && hasKids(node)) { if (!isOpen(node)) setExpanded(node.path, true); else go(idx + 1); markSelected(); }
      break;
    case 'ArrowLeft':
      if (node && isOpen(node) && !S.filter) { setExpanded(node.path, false); markSelected(); }
      else if (node && S.parent.has(node.path)) selectNode(S.byPath.get(S.parent.get(node.path)), { defer: true });
      break;
    case 'Enter':
      if (node && node.type === 'link') selectNode(node, { follow: true });
      else if (node && hasKids(node)) { setExpanded(node.path, !isOpen(node)); markSelected(); }
      break;
    default: return;
  }
  e.preventDefault();
}

document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  const k = e.key.toLowerCase();
  const inSearch = document.activeElement === searchEl;
  if (mod && k === 'o') { e.preventDefault(); openFile(null); }
  else if (mod && k === 'e') { e.preventDefault(); exportCsv(); }
  else if (mod && k === 'i') { e.preventDefault(); showStats(); }
  else if (mod && k === 'w') { e.preventDefault(); if (S.tree) closeFile(); }
  else if (mod && k === 'f') { e.preventDefault(); if (S.tree) { searchEl.focus(); searchEl.select(); } }
  else if (e.key === '/' && !inSearch) { e.preventDefault(); if (S.tree) { searchEl.focus(); searchEl.select(); } }
  else if (e.key === 'Escape') {
    if (inSearch || S.filter) { clearTimeout(filterT); setFilter(''); treeEl.focus(); }
  }
  else if (inSearch && (e.key === 'ArrowDown' || e.key === 'Enter')) {
    e.preventDefault();
    clearTimeout(filterT);
    setFilter(searchEl.value.trim());
    treeEl.focus();
    const rows = visibleRows();
    if (rows.length) selectNode(S.byPath.get(rows[0].dataset.path));
  }
  else if (document.activeElement === treeEl && !mod) treeKey(e);
});

// Drag and drop: launch.py's drop handler receives the real path (browsers
// hide it from page scripts) and calls openFile(); here we only stop the
// webview from navigating to the file and give visual feedback.
const dropZone = $('dropZone');
let dragDepth = 0;
document.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; dropZone.classList.add('drag'); });
document.addEventListener('dragover', e => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; });
document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; dropZone.classList.remove('drag'); } });
document.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  dropZone.classList.remove('drag');
  const dropAt = Date.now();
  setTimeout(() => {
    if (S.lastOpenAt < dropAt) toast('Could not get the dropped file\'s path - use Open instead', true);
  }, 1500);
});

// Sidebar resize
const rh = $('resizeHandle');
let resizing = false;
function setSidebar(w) {
  w = clamp(Math.round(w), 180, Math.max(180, Math.min(700, window.innerWidth - 320)));
  mainEl.style.setProperty('--sbw', w + 'px');
  return w;
}
rh.addEventListener('mousedown', e => { e.preventDefault(); resizing = true; rh.classList.add('dragging'); document.body.style.cursor = 'col-resize'; });
document.addEventListener('mousemove', e => { if (resizing) setSidebar(e.clientX); });
document.addEventListener('mouseup', () => {
  if (!resizing) return;
  resizing = false;
  rh.classList.remove('dragging');
  document.body.style.cursor = '';
  // Saved in config.json: pywebview's private mode discards localStorage.
  const w = parseInt(getComputedStyle(mainEl).getPropertyValue('--sbw'), 10);
  apiReady.then(a => a.set_sidebar_width(w)).catch(() => {});
});

// ═══════════════════ Init ═══════════════════
apiReady.then(async a => {
  try {
    const cfg = await a.get_config();
    const v = cfg.viewer || {};
    S.cfg.precision = clamp(parseInt(v.float_precision, 10) || 8, 1, 17);
    S.cfg.maxImagePx = Number(v.max_image_pixels) || 4000000;
    setSidebar(Number(v.sidebar_width) || 280);
    if (cfg.version) $('welcomeFoot').textContent = 'H5 Lens v' + cfg.version;
  } catch (_) {}
  loadRecent();
});
</script>
